name: Release skills

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (e.g. v1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: AGENTS_SKILLS_BUILD_DEPLOY=0 bun run build
      - run: bun run skills-check
      - run: sh scripts/package-release.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$RELEASE_TAG" in v*) ;; *) echo 'Expected a version tag starting with v' >&2; exit 1 ;; esac
          gh release create "$RELEASE_TAG" dist/agents-skills.tar.gz \
            --verify-tag --generate-notes --latest
