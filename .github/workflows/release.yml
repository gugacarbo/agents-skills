name: Release skills

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "skills.sh"
      - "src/install.sh"
      - "src/update.sh"
      - "src/build.sh"
      - "scripts/package-release.sh"
      - "README.md"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (e.g. v1.0.0); leave empty to auto-bump
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
      - name: Determine release tag
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            case "$INPUT_TAG" in
              v*) ;;
              *) echo 'Expected a version tag starting with v' >&2; exit 1 ;;
            esac
            {
              echo "tag=$INPUT_TAG"
              echo "should_release=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          existing_tag=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n 1 || true)
          if [ -n "$existing_tag" ]; then
            echo "HEAD already tagged with $existing_tag; skipping auto-release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1 || true)
          if [ -z "$latest_tag" ]; then
            major=0
            minor=0
            patch=0
            range="HEAD"
          else
            version_core=${latest_tag#v}
            IFS=. read -r major minor patch << EOF
          $version_core
          EOF
            range="${latest_tag}..HEAD"
          fi

          subjects=$(git log "$range" --format='%s')
          bodies=$(git log "$range" --format='%B')

          if printf '%s\n' "$bodies" | grep -qE '^BREAKING[ -]CHANGE:' || printf '%s\n' "$subjects" | grep -qE '^[a-z]+(\([^)]+\))?!:'; then
            major=$((major + 1))
            minor=0
            patch=0
          elif printf '%s\n' "$subjects" | grep -qE '^feat(\([^)]+\))?:'; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          next_tag="v${major}.${minor}.${patch}"
          echo "Next release tag: $next_tag (from ${latest_tag:-none})"
          {
            echo "tag=$next_tag"
            echo "should_release=true"
          } >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.should_release == 'true'
        with:
          bun-version: 1.3.11
      - if: steps.version.outputs.should_release == 'true'
        run: bun install --frozen-lockfile
      - if: steps.version.outputs.should_release == 'true'
        run: bun run test
      - if: steps.version.outputs.should_release == 'true'
        run: AGENTS_SKILLS_BUILD_DEPLOY=0 bun run build
      - if: steps.version.outputs.should_release == 'true'
        run: bun run skills-check
      - if: steps.version.outputs.should_release == 'true'
        run: sh scripts/package-release.sh
      - name: Publish release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" > /dev/null; then
            gh release create "$RELEASE_TAG" dist/agents-skills.tar.gz \
              --verify-tag --generate-notes --latest
          else
            gh release create "$RELEASE_TAG" dist/agents-skills.tar.gz \
              --target "$GITHUB_SHA" --generate-notes --latest
          fi
